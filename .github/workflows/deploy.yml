name: Deploy website

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"

concurrency:
  group: deploy-website-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Forge website deployment
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Until the site moves from Hostpoint to Forge the deploy hook secrets are not set:
      # the job then skips with a notice instead of failing every push.
      - name: Trigger production deployment
        if: github.ref_name == 'main'
        env:
          FORGE_DEPLOY_HOOK: ${{ secrets.FORGE_ABUDHABI_PRODUCTION_DEPLOY_HOOK }}
        run: |
          if [ -z "$FORGE_DEPLOY_HOOK" ]; then
            echo "::notice::FORGE_ABUDHABI_PRODUCTION_DEPLOY_HOOK is not set; skipping the Forge deployment."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --request POST "$FORGE_DEPLOY_HOOK"

      - name: Trigger staging deployment
        if: github.ref_name == 'staging'
        env:
          FORGE_DEPLOY_HOOK: ${{ secrets.FORGE_ABUDHABI_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$FORGE_DEPLOY_HOOK" ]; then
            echo "::notice::FORGE_ABUDHABI_STAGING_DEPLOY_HOOK is not set; skipping the Forge deployment."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --request POST "$FORGE_DEPLOY_HOOK"
